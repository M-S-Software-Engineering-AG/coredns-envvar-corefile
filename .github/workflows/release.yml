name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    uses: M-S-Software-Engineering-AG/ci-workflows/.github/workflows/go-release.yml@main
    with:
      binary-name: corefile-gen
      targets: linux/amd64 linux/arm64 linux/arm linux/386 linux/ppc64le linux/s390x
