name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build linux binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64 arm 386 ppc64le s390x; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' \
              -o "dist/coredns-envvar-corefile-linux-$arch" .
          done
      # ponytail: scans the binaries, not the image — distroless static carries no packages worth scanning.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs  # reads the Go module info embedded in the binaries
          scan-ref: dist
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7
        env:
          VERSION: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          push: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
